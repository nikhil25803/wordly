<svg xmlns="http://www.w3.org/2000/svg" width="620" height="100" viewBox="0 0 620 100" role="img" aria-labelledby="title description">
  <title id="title">wordly word count output</title>
  <desc id="description">Terminal output showing the number of words in the embedded dictionary.</desc>
  <rect width="620" height="100" rx="10" fill="#0b1118"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/><circle cx="38" cy="18" r="5" fill="#eab308"/><circle cx="56" cy="18" r="5" fill="#22c55e"/>
  <text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#f3f4f6"><tspan fill="#94a3b8">$ wordly --words</tspan><tspan x="24" dy="24" fill="#5bcb76">5757</tspan></text>
</svg>

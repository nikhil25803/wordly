<svg xmlns="http://www.w3.org/2000/svg" width="620" height="255" viewBox="0 0 620 255" role="img" aria-labelledby="title description">
  <title id="title">wordly stats output</title>
  <desc id="description">Plain terminal output showing completed games, wins, streaks, and guess distribution.</desc>
  <rect width="620" height="255" rx="10" fill="#0b1118"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/><circle cx="38" cy="18" r="5" fill="#eab308"/><circle cx="56" cy="18" r="5" fill="#22c55e"/>
  <text x="24" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#f3f4f6">
    <tspan x="24" dy="0" fill="#94a3b8">$ wordly --stats</tspan>
    <tspan x="24" dy="25">Played 12  Wins 9  Win 75%  Streak 3  Max 5</tspan>
    <tspan x="24" dy="25" fill="#d7b93e">Guess distribution:</tspan>
    <tspan x="24" dy="21">1  ███          1</tspan>
    <tspan x="24" dy="21">2  ███          1</tspan>
    <tspan x="24" dy="21">3  ████████████ 4</tspan>
    <tspan x="24" dy="21">4  ███          1</tspan>
    <tspan x="24" dy="21">5  ██████       2</tspan>
    <tspan x="24" dy="21">6               0</tspan>
  </text>
</svg>

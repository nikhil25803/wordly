      <rect class="present" x="64" width="54" height="40" rx="3"/><text class="letter" x="91" y="21">E</text>
      <rect class="present" x="128" width="54" height="40" rx="3"/><text class="letter" x="155" y="21">I</text>
      <rect class="absent" x="192" width="54" height="40" rx="3"/><text class="letter" x="219" y="21">G</text>
      <rect class="absent" x="256" width="54" height="40" rx="3"/><text class="letter" x="283" y="21">N</text>
    </g>
    <g transform="translate(0 96)">

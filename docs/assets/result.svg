  <text x="380" y="452" font-size="15" text-anchor="middle">Answer RIVER<tspan class="muted">  │  5/6</tspan></text>
  <g font-size="16">
    <text class="green-text" x="298" y="507" font-weight="700">› Share Result</text>
    <text x="316" y="542">View Stats</text>
    <text x="316" y="577">Back to Menu</text>
    <text x="316" y="612">Quit</text>
  </g>
  <text class="muted" x="380" y="667" font-size="13" text-anchor="middle">↑/↓ or j/k navigate  •  s share  •  esc menu</text>

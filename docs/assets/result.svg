      <rect class="absent" x="64" width="54" height="40" rx="3"/><text class="letter" x="91" y="21">L</text>
      <rect class="absent" x="128" width="54" height="40" rx="3"/><text class="letter" x="155" y="21">O</text>
      <rect class="absent" x="192" width="54" height="40" rx="3"/><text class="letter" x="219" y="21">U</text>
      <rect class="absent" x="256" width="54" height="40" rx="3"/><text class="letter" x="283" y="21">D</text>
    </g>
    <g transform="translate(0 144)">
      <rect class="correct" width="54" height="40" rx="3"/><text class="letter" x="27" y="21">R</text>
      <rect class="correct" x="64" width="54" height="40" rx="3"/><text class="letter" x="91" y="21">I</text>
      <rect class="absent" x="128" width="54" height="40" rx="3"/><text class="letter" x="155" y="21">D</text>
      <rect class="correct" x="192" width="54" height="40" rx="3"/><text class="letter" x="219" y="21">E</text>
      <rect class="correct" x="256" width="54" height="40" rx="3"/><text class="letter" x="283" y="21">R</text>
    </g>
    <g transform="translate(0 192)">
      <rect class="correct" width="54" height="40" rx="3"/><text class="letter" x="27" y="21">R</text>
      <rect class="correct" x="64" width="54" height="40" rx="3"/><text class="letter" x="91" y="21">I</text>
      <rect class="correct" x="128" width="54" height="40" rx="3"/><text class="letter" x="155" y="21">V</text>
      <rect class="correct" x="192" width="54" height="40" rx="3"/><text class="letter" x="219" y="21">E</text>
      <rect class="correct" x="256" width="54" height="40" rx="3"/><text class="letter" x="283" y="21">R</text>
    </g>
    <g transform="translate(0 240)">

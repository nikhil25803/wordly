      <rect class="empty" x="64" width="54" height="40" rx="3"/><text class="letter muted" x="91" y="21">·</text>
      <rect class="empty" x="128" width="54" height="40" rx="3"/><text class="letter muted" x="155" y="21">·</text>
      <rect class="empty" x="192" width="54" height="40" rx="3"/><text class="letter muted" x="219" y="21">·</text>
      <rect class="empty" x="256" width="54" height="40" rx="3"/><text class="letter muted" x="283" y="21">·</text>
    </g>

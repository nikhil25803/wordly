    </g>
    <g transform="translate(0 186)">
      <rect class="present" width="62" height="52" rx="4"/><text class="letter" x="31" y="27">N</text>
      <rect class="correct" x="74" width="62" height="52" rx="4"/><text class="letter" x="105" y="27">A</text>
      <rect class="correct" x="148" width="62" height="52" rx="4"/><text class="letter" x="179" y="27">R</text>

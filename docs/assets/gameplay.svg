  <text x="28" y="505" font-size="17" font-weight="700" fill="#6aaa64">Solved in 5/6!  Answer: CARON</text>
  <text class="muted small" x="28" y="532">bold=correct  underline=present  dim=absent</text>

  <g transform="translate(28 555)">
    <rect width="104" height="34" rx="4" fill="#374151"/><text x="14" y="22" font-size="14">Played 1</text>

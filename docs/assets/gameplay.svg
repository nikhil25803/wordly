      <rect class="absent" x="148" width="62" height="52" rx="4"/><text class="letter" x="179" y="27">E</text>
      <rect class="present" x="222" width="62" height="52" rx="4"/><text class="letter" x="253" y="27">A</text>
      <rect class="absent" x="296" width="62" height="52" rx="4"/><text class="letter" x="327" y="27">T</text>
    </g>
    <g transform="translate(0 124)">

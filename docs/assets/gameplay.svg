<svg xmlns="http://www.w3.org/2000/svg" width="760" height="770" viewBox="0 0 760 770" role="img" aria-labelledby="title description">
  <title id="title">Completed Wordly game</title>
  <desc id="description">A terminal showing a solved five-letter puzzle and player statistics.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f8fafc }
    .muted { fill: #9ca3af }
    .tile { fill: #374151 }
    .correct { fill: #6aaa64 }
    .present { fill: #c9b458 }
    .absent { fill: #787c7e }
    .letter { font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle }
    .small { font-size: 14px }
  </style>
  <rect width="760" height="770" rx="12" fill="#111827"/>
  <circle cx="22" cy="20" r="6" fill="#ef4444"/>
  <circle cx="42" cy="20" r="6" fill="#eab308"/>
  <circle cx="62" cy="20" r="6" fill="#22c55e"/>
  <text x="28" y="65" font-size="24" font-weight="700" fill="#6aaa64">W O R D L Y</text>
  <text class="muted small" x="28" y="90">2026-10-02  •  player</text>

  <g transform="translate(28 112)">

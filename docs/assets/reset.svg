<svg xmlns="http://www.w3.org/2000/svg" width="620" height="100" viewBox="0 0 620 100" role="img" aria-labelledby="title">
  <title id="title">wordly reset output</title>
  <rect width="620" height="100" rx="10" fill="#111827"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/><circle cx="38" cy="18" r="5" fill="#eab308"/><circle cx="56" cy="18" r="5" fill="#22c55e"/>
  <text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#e5e7eb"><tspan fill="#9ca3af">$ wordly --reset</tspan><tspan x="24" dy="24" fill="#6aaa64">Reset stats for player.</tspan></text>
</svg>

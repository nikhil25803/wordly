name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Test installer
        env:
          WORDLY_RELEASE_URL: file://${{ github.workspace }}/dist
          WORDLY_INSTALL_DIR: ${{ runner.temp }}/wordly/bin
          WORDLY_DB: ${{ runner.temp }}/wordly/data/wordly.db
        run: |
          ./install.sh
          test "$("$WORDLY_INSTALL_DIR/wordly" --words)" = 5757

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test, build, and run (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            binary: ./wordly
          - name: macOS
            os: macos-latest
            binary: ./wordly
          - name: Windows
            os: windows-latest
            binary: ./wordly.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o ${{ matrix.binary }} ./cmd/wordly

      - name: Run
        run: ${{ matrix.binary }} --help

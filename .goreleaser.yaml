version: 2

project_name: wordly

before:
  hooks:
    - go test ./...

builds:
  - id: wordly
    main: ./cmd/wordly
    binary: wordly

    ldflags:
      - -s -w -X github.com/nikhil25803/wordly/internal.version={{.Version}}

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

archives:
  - id: wordly
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

brews:
  - name: wordly
    ids:
      - wordly
    repository:
      owner: nikhil25803
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/nikhil25803/wordly"
    description: "One shared Wordle every UTC day, played entirely in your terminal"
    license: MIT
    test: |
      system bin/"wordly", "--help"

release:
  github:
    owner: nikhil25803
    name: wordly
